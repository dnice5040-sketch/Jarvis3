name: Build JARVIS
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - run: unzip -q Jarvis-Complete.zip
      - run: gradle assembleDebug --no-daemon
        working-directory: Jarvis
      - run: |
          cp Jarvis/app/build/outputs/apk/debug/app-debug.apk JARVIS.apk
          gh release create "build-${{ github.run_number }}" JARVIS.apk --title "JARVIS build ${{ github.run_number }}" --notes "Debug build"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
